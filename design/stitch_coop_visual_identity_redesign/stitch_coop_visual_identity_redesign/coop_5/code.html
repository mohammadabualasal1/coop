<!DOCTYPE html><html dir="rtl" lang="ar"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Order Confirmation - COOP</title>

                        "secondary-fixed-dim": "#ffb68f",

                    "spacing": {

                        "unit": "4px",

<style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Nav shell is suppressed for transactional success screen as per rules -->
<main class="w-full max-w-[480px] mx-auto bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(139,30,63,0.04)] p-8 text-center border border-outline-variant/30 relative overflow-hidden">
<!-- Background subtle accent -->
<div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
<div class="flex flex-col items-center gap-stack-lg">
<!-- Logo -->
<div class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">
                COOP
            </div>
<!-- Success Icon -->
<div class="w-24 h-24 rounded-full bg-primary-container flex items-center justify-center mb-2 animate-[pulse_2s_ease-in-out_infinite]">
<span class="material-symbols-outlined text-[48px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<!-- Success Message -->
<div class="flex flex-col gap-stack-sm">
<h1 class="font-headline-md text-headline-md text-on-background">تم استلام طلبك بنجاح!</h1>
<p class="font-body-md text-on-surface-variant text-body-lg">شكراً لتسوقك معنا. سنقوم بتجهيز طلبك بأسرع وقت.</p>
</div>
<!-- Order Details Card -->
<div class="w-full bg-surface-container-low rounded-lg p-6 flex flex-col gap-4 text-right border border-outline-variant/20">
<div class="flex justify-between items-center border-b border-outline-variant/20 pb-4">
<span class="font-body-md text-body-md text-on-surface-variant">رقم الطلب</span>
<span class="font-headline-sm text-headline-sm text-primary" dir="ltr">#12345678</span>
</div>
<div class="flex justify-between items-center py-2">
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">schedule</span>
                        وقت التوصيل المتوقع
                    </span>
<span class="font-body-md text-body-md font-semibold">١٠:٤٥ مساءً</span>
</div>
<div class="flex justify-between items-start py-2">
<span class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">location_on</span>
                        عنوان التوصيل
                    </span>
<span class="font-body-md text-body-md font-semibold text-left max-w-[60%]">عمان، شارع مكة</span>
</div>
<div class="flex justify-between items-center border-t border-outline-variant/20 pt-4 mt-2">
<span class="font-headline-sm text-headline-sm text-on-background">المبلغ الإجمالي</span>
<span class="font-headline-sm text-headline-sm text-primary">150.00 د.أ</span>
</div>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-stack-md mt-4">
<button class="w-full bg-primary text-on-primary font-button text-button py-4 rounded-[12px] hover:bg-tertiary transition-colors active:scale-[0.98]">
                    تتبع الطلب
                </button>
<button class="w-full bg-transparent border border-primary text-primary font-button text-button py-4 rounded-[12px] hover:bg-primary/5 transition-colors active:scale-[0.98]">
                    العودة للرئيسية
                </button>
</div>
</div>
</main>


</body></html>
