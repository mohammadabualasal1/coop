<style>
        .loading-bar-container {
            width: 120px;
            height: 4px;
            background-color: #E9E2DD; /* Outline variant for warmth */
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background-color: #6c0029; /* primary */
            border-radius: 9999px;
            animation: loading 1.5s infinite ease-in-out;
        }

        @keyframes loading {
            0% {
                left: -40%;
            }
            50% {
                left: 100%;
            }
            100% {
                left: -40%;
            }
        }
    </style>

<!-- Note: TopAppBar and BottomNavBar are intentionally suppressed for this Splash Screen per the semantic mapping rules (Linear/Transactional/Splash intent). -->
<script>
        // Simple entry animation
        document.addEventListener("DOMContentLoaded", () => {
            const logo = document.querySelector('img');
            logo.style.opacity = '0';
            logo.style.transform = 'translateY(20px)';
            logo.style.transition = 'all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1)';
            
            setTimeout(() => {
                logo.style.opacity = '1';
                logo.style.transform = 'translateY(0)';
            }, 100);

            const footerText = document.querySelector('footer h1');
            footerText.style.opacity = '0';
            footerText.style.transition = 'opacity 1s ease-in-out';
            
            setTimeout(() => {
                footerText.style.opacity = '0.9';
            }, 600);
        });
    </script>
