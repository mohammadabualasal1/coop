<!DOCTYPE html>

            border-color: #6c0029;
        }

        ::-webkit-scrollbar { display: none; }

                        "on-surface-variant": "#564145",
                        "on-primary-fixed": "#3f0015",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#6c0029",
                        "secondary-container": "#feb289",
                        "surface-dim": "#dbd9dd",
                        "tertiary-fixed": "#ffd9de",
                        "tertiary": "#62152c",
                        "error-container": "#ffdad6",
                        "surface": "#faf9fd",
                        "surface-variant": "#e3e2e6",

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#FFF9F5] text-on-surface min-h-screen flex flex-col items-center">
<!-- Top App Bar (Task Focused, Custom Back Action) -->
<header class="bg-surface shadow-sm docked full-width top-0 w-full z-50">
<div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full max-w-container-max mx-auto dir-rtl">
<button aria-label="Back" class="text-on-surface-variant hover:bg-surface-container-high p-2 rounded-full transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary italic font-black">COOP</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[600px] px-margin-mobile md:px-0 py-stack-lg mx-auto flex flex-col gap-stack-lg">
<div class="flex flex-col gap-stack-sm">
<h2 class="font-headline-sm text-headline-sm text-on-surface">تفاصيل العنوان</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">الرجاء تأكيد موقعك وإضافة تفاصيل المبنى لضمان دقة التوصيل.</p>
</div>
<!-- Form Card -->
<form class="bg-surface-container-lowest rounded-[12px] p-4 md:p-6 shadow-[0px_4px_20px_rgba(139,30,63,0.04)] flex flex-col gap-stack-lg border border-[#E9E2DD]">
<!-- Map Snippet Placeholder -->
<div class="w-full h-40 rounded-[8px] overflow-hidden border border-[#E9E2DD] relative">
<img class="w-full h-full object-cover" data-alt="A clean, minimal vector map snippet showing a stylized pin on a street grid in a warm, premium light mode aesthetic. The map features soft cream roads, subtle off-white blocks, and a sharp burgundy location pin to match a high-end UI design language." data-location="Riyadh, Saudi Arabia" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD0yIN3ilu5PIAZcc0peattdiQG7-FkiAIwqUtEOlDjH94VfU7UFTgHU4JKz4tKnoo_GXvKMnOJEbD4C2Watst1j4w3_cr1tz_EVHERZZyMu_HqeSU1AzrstYjdUWkuaJuF58xquxn39TlhvUuKsQ6O1AXWKimkoF4enEjAuPOUvuK2gfUxMPJl6yBf3cdyq_rWg2YSepE9mHbYnnc73jMwvtOwC0_A3vhSJrMOwY9bn44A9LkUGvO-Hg"/>
<div class="absolute bottom-2 right-2 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-full shadow-sm flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-[16px]" data-icon="my_location" data-weight="fill" style="font-variation-settings: 'FILL' 1;">my_location</span>
<span class="font-label-caps text-label-caps text-on-surface">حي الملقا، الرياض</span>
</div>
</div>
<!-- Address Labels -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant">نوع العنوان</label>
<div class="flex gap-3">
<label class="cursor-pointer flex-1">
<input checked="" class="peer sr-only" name="address_type" type="radio" value="home"/>
<div class="text-center py-2 px-4 rounded-xl border border-[#E9E2DD] bg-surface-container-lowest text-on-surface-variant peer-checked:bg-primary-container/10 peer-checked:border-primary peer-checked:text-primary transition-all font-button text-button">
                            المنزل
                        </div>
</label>
<label class="cursor-pointer flex-1">
<input class="peer sr-only" name="address_type" type="radio" value="work"/>
<div class="text-center py-2 px-4 rounded-xl border border-[#E9E2DD] bg-surface-container-lowest text-on-surface-variant peer-checked:bg-primary-container/10 peer-checked:border-primary peer-checked:text-primary transition-all font-button text-button">
                            العمل
                        </div>
</label>
<label class="cursor-pointer flex-1">
<input class="peer sr-only" name="address_type" type="radio" value="other"/>
<div class="text-center py-2 px-4 rounded-xl border border-[#E9E2DD] bg-surface-container-lowest text-on-surface-variant peer-checked:bg-primary-container/10 peer-checked:border-primary peer-checked:text-primary transition-all font-button text-button">
                            أخرى
                        </div>
</label>
</div>
</div>
<!-- Details Grid -->
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-stack-sm col-span-2 md:col-span-1">
<label class="font-label-caps text-label-caps text-on-surface-variant">رقم المبنى</label>
<input class="w-full p-3 rounded-[8px] border border-[#E9E2DD] bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline-variant outline-none transition-all input-glow" placeholder="مثال: 45A" type="text"/>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant">الدور</label>
<input class="w-full p-3 rounded-[8px] border border-[#E9E2DD] bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline-variant outline-none transition-all input-glow" placeholder="مثال: 2" type="text"/>
</div>
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant">رقم الشقة</label>
<input class="w-full p-3 rounded-[8px] border border-[#E9E2DD] bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline-variant outline-none transition-all input-glow" placeholder="مثال: 12" type="text"/>
</div>
</div>
<!-- Instructions -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant">تعليمات إضافية للتوصيل (اختياري)</label>
<textarea class="w-full p-3 rounded-[8px] border border-[#E9E2DD] bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-outline-variant outline-none transition-all input-glow resize-none" placeholder="مثال: يرجى ترك الطلب عند الباب..." rows="3"></textarea>
</div>
<!-- Action Area -->
<div class="pt-stack-md mt-auto">
<button class="w-full bg-primary text-on-primary rounded-[12px] py-4 px-8 font-button text-button shadow-md hover:shadow-lg hover:bg-[#5a0022] transition-all active:scale-95 duration-200" type="button">
                    حفظ العنوان
                </button>
</div>
</form>
</main>
</body></html>
