                        يساعدنا تحديد موقعك في عرض المتاجر القريبة منك وحساب رسوم التوصيل بدقة لتقديم أفضل العروض.

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const screen1 = document.getElementById('permission-screen');
            const screen2 = document.getElementById('map-screen');
            const btnManual = document.getElementById('btn-manual-location');
            const btnUseLoc = document.getElementById('btn-use-location');
            const btnBack = document.getElementById('btn-back');

            // Navigate to Map
            const showMap = () => {
                screen2.classList.remove('translate-x-full');
                screen1.classList.add('-translate-x-full');
            };

            // Navigate back to Permission
            const showPermission = () => {
                screen2.classList.add('translate-x-full');
                screen1.classList.remove('-translate-x-full');
            };

            btnManual.addEventListener('click', showMap);
            btnUseLoc.addEventListener('click', () => {
                // Simulate loading then show map
                const originalText = btnUseLoc.innerHTML;
                btnUseLoc.innerHTML = `<span class="material-symbols-outlined animate-spin">refresh</span> جاري التحديد...`;
                setTimeout(() => {
                    btnUseLoc.innerHTML = originalText;
                    showMap();
                }, 800);
            });
            
            btnBack.addEventListener('click', showPermission);
        });
    </script>
