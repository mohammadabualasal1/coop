<script>
        // Simple star rating logic
        function setupRating(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const buttons = container.querySelectorAll('button');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const value = parseInt(e.currentTarget.dataset.value);
                    buttons.forEach(b => {
                        if (parseInt(b.dataset.value) <= value) {
                            b.classList.remove('text-outline-variant');
                            b.classList.add('text-secondary');
                            b.style.fontVariationSettings = "'FILL' 1";
                        } else {
                            b.classList.add('text-outline-variant');
                            b.classList.remove('text-secondary');
                            b.style.fontVariationSettings = "'FILL' 0";
                        }
                    });
                });
            });
        }

        setupRating('store-rating');
        setupRating('driver-rating');
    </script>
