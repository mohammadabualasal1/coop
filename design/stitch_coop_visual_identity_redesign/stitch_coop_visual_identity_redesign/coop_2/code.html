<!DOCTYPE html><html class="dark" dir="rtl" lang="ar"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Live Order Tracking - COOP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Montserrat:wght@600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "outline": "#897174",
                "error-container": "#ffdad6",
                "on-error": "#ffffff",
                "on-surface-variant": "#564145",
                "on-tertiary-fixed-variant": "#7c293f",
                "primary": "#6c0029",
                "on-secondary-fixed-variant": "#6d3919",
                "on-primary-fixed": "#3f0015",
                "secondary": "#89502e",
                "secondary-fixed": "#ffdbca",
                "on-surface": "#1a1b1e",
                "on-primary": "#ffffff",
                "surface-container-low": "#f4f3f7",
                "on-secondary": "#ffffff",
                "surface-container": "#efedf1",
                "surface-container-high": "#e9e7eb",
                "primary-fixed-dim": "#ffb2bf",
                "secondary-fixed-dim": "#ffb68f",
                "on-secondary-fixed": "#331200",
                "tertiary-container": "#802c42",
                "on-primary-container": "#ff9db0",
                "inverse-surface": "#2f3033",
                "tertiary-fixed": "#ffd9de",
                "surface-container-highest": "#e3e2e6",
                "surface-bright": "#faf9fd",
                "surface": "#faf9fd",
                "on-tertiary": "#ffffff",
                "primary-fixed": "#ffd9de",
                "on-background": "#1a1b1e",
                "error": "#ba1a1a",
                "on-error-container": "#93000a",
                "on-tertiary-container": "#ff9db1",
                "surface-dim": "#dbd9dd",
                "surface-container-lowest": "#ffffff",
                "on-primary-fixed-variant": "#871b3c",
                "on-secondary-container": "#794222",
                "inverse-primary": "#ffb2bf",
                "surface-tint": "#a73453",
                "secondary-container": "#feb289",
                "inverse-on-surface": "#f1f0f4",
                "primary-container": "#8b1e3f",
                "outline-variant": "#ddbfc3",
                "surface-variant": "#e3e2e6",
                "tertiary": "#62152c",
                "on-tertiary-fixed": "#3f0016",
                "tertiary-fixed-dim": "#ffb1c0",
                "background": "#faf9fd"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
                "container-max": "1280px",
                "margin-desktop": "40px",
                "unit": "4px",
                "gutter": "24px",
                "stack-lg": "32px",
                "margin-mobile": "16px",
                "stack-md": "16px",
                "stack-sm": "8px"
        },
        "fontFamily": {
                "display-lg": ["Montserrat"],
                "display-lg-mobile": ["Montserrat"],
                "button": ["Montserrat"],
                "label-caps": ["Montserrat"],
                "body-lg": ["Inter"],
                "body-md": ["Inter"],
                "headline-sm": ["Montserrat"],
                "body-sm": ["Inter"],
                "headline-md": ["Montserrat"]
        },
        "fontSize": {
                "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                "button": ["16px", {"lineHeight": "20px", "fontWeight": "600"}],
                "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
        }
      }
    }
  }
</script>
<style>
  body {
    background-color: #faf9fd; /* background */
    color: #1a1b1e; /* on-background */
  }
  .map-container {
    height: 50vh;
    min-height: 400px;
    position: relative;
    overflow: hidden;
  }
  .timeline-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: #e3e2e6; /* surface-variant */
    position: relative;
    z-index: 2;
  }
  .timeline-dot.completed {
    background-color: #6c0029; /* primary */
  }
  .timeline-dot.current {
    background-color: #6c0029; /* primary */
    box-shadow: 0 0 0 4px #ffb2bf; /* primary-fixed-dim */
  }
  .timeline-line {
    position: absolute;
    top: 6px;
    bottom: -6px;
    right: 5px; /* Adjust for RTL */
    width: 2px;
    background-color: #e3e2e6; /* surface-variant */
    z-index: 1;
  }
  .timeline-line.completed {
    background-color: #6c0029; /* primary */
  }
</style>
</head>
<body class="font-body-md text-body-md antialiased pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-background dark:bg-background h-16 shadow-sm">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-container-max mx-auto">
<button aria-label="Back" class="p-2 text-primary hover:bg-surface-container-low active:scale-95 duration-150 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
<div class="font-display-lg-mobile text-display-lg-mobile font-bold text-primary dark:text-primary-fixed-dim tracking-tight">COOP</div>
<button aria-label="Help" class="p-2 text-on-surface-variant hover:bg-surface-container-low active:scale-95 duration-150 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">help_outline</span>
</button>
</div>
</header>
<main class="pt-16 max-w-container-max mx-auto w-full">
<!-- Map Section -->
<div class="map-container relative w-full bg-surface-container-low">
<!-- Faking Map Imagery -->
<img alt="Map of Amman" class="w-full h-full object-cover" data-alt="A highly detailed top-down map view of Amman, Jordan, rendered in a bright, modern, minimalist style. The streets are clean white and warm gray lines against a soft off-white background. The lighting is bright and even, casting no harsh shadows. A distinct burgundy route line winds through the streets." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDWRYQefXkK2_fw4MUo1PDIUF6ARvMQbjWYc8h2Z7gUf3xl_LdhkM5jz0IL1ysh1Fy1samGP0BTEwrbQkt0WqnSxQbT-9PhMDwMbAuOiXQavouQL0Z-6MBbHF1Zz6jd5L4dqD2buocjEr3sF3D87eEN2NymOcLxUCWFxrJhuj0UZd3SlFVvCDOast28ezzu_pQKMzaBFn8E3TjH_5XZwPK3h03rPqrqlsd8gMnZoTYqJzHTTovMQbqtvg">
<!-- Overlay Route and Markers (Simulated) -->
<div class="absolute inset-0 pointer-events-none p-8 flex flex-col justify-center items-center">
<!-- Simulated Route SVG -->
<svg class="absolute w-full h-full text-primary" preserveAspectRatio="none" viewBox="0 0 100 100">
<path d="M 20,80 Q 40,60 60,70 T 80,30" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<!-- Store Marker -->
<div class="absolute top-[25%] left-[75%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-surface-container-lowest p-2 rounded-full shadow-lg border border-outline-variant">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">storefront</span>
</div>
</div>
<!-- Driver Marker -->
<div class="absolute top-[65%] left-[55%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-primary p-2 rounded-full shadow-lg border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
</div>
<!-- Customer Marker -->
<div class="absolute top-[75%] left-[20%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-surface-container-lowest p-2 rounded-full shadow-lg border border-outline-variant">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">person_pin_circle</span>
</div>
</div>
</div>
<!-- ETA Overlay -->
<div class="absolute top-4 right-4 bg-surface-container-lowest px-4 py-2 rounded-lg shadow-md border border-outline-variant z-10 flex items-center gap-2">
<span class="material-symbols-outlined text-primary">schedule</span>
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold">وصول خلال ١٢ دقيقة</span>
</div>
</div>
<!-- Details Section -->
<div class="px-margin-mobile py-stack-lg max-w-2xl mx-auto -mt-8 relative z-20">
<!-- Driver Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(139,30,63,0.04)] p-4 flex items-center gap-4 mb-stack-lg border border-outline-variant">
<img alt="أحمد محمد" class="w-16 h-16 rounded-full object-cover border-2 border-surface-container-low" data-alt="A professional headshot of a friendly Middle Eastern male delivery driver named Ahmed. He is smiling warmly, wearing a clean, modern burgundy uniform shirt. The background is a soft, blurred bright white setting, emphasizing a premium, trustworthy service aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuARHX4LUmMuvIz4rtcloiaLw2JR2Ogjw6ej4FYWMdhxAojYxkXy-HyMOqX_Wk3u-oKzLB_9kSB_Qors5jqAWDwwMjMfm6DBPOhnumtDx6pyX2lPAKAxQ7kHqq-Iv53Fg-T351_Bi4nuaNgFukWBufrj83GjosAhG4XMeV-nr6kyOxGlt59rLEFBtj51TwqmEzzbKfbwq65PSSEEDwYpV_SUliKPOFBZthLSbuPz_5rjkSq2DHzZab4Ing">
<div class="flex-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface font-semibold mb-1">أحمد محمد</h2>
<div class="flex items-center gap-2 text-on-surface-variant font-body-sm text-body-md">
<span class="flex items-center text-secondary"><span class="material-symbols-outlined mr-1 text-body-sm">star</span>٤.٩/٥</span>
<span class="">•</span>
<span class="">تويوتا بريوس</span>
</div>
</div>
<button class="w-12 h-12 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center hover:bg-primary hover:text-on-primary transition-colors">
<span class="material-symbols-outlined">call</span>
</button>
</div>
<!-- Order Timeline -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(139,30,63,0.04)] p-6 border border-outline-variant">
<h3 class="font-headline-md text-headline-md font-bold mb-6 text-on-surface">حالة الطلب</h3>
<div class="relative pr-4"> <!-- pr-4 for RTL padding -->
<!-- Item 1 -->
<div class="flex gap-4 pb-6 relative">
<div class="timeline-line completed"></div>
<div class="timeline-dot completed mt-1"></div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface font-semibold">تم تأكيد الطلب</p>
</div>
</div>
<!-- Item 2 -->
<div class="flex gap-4 pb-6 relative">
<div class="timeline-line completed"></div>
<div class="timeline-dot completed mt-1"></div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface font-semibold">جاري التجهيز</p>
</div>
</div>
<!-- Item 3 (Current) -->
<div class="flex gap-4 pb-6 relative">
<div class="timeline-line"></div>
<div class="timeline-dot current mt-1"></div>
<div class="flex-1">
<p class="font-headline-sm text-headline-sm text-primary font-bold">تم تعيين السائق</p>
</div>
</div>
<!-- Item 4 -->
<div class="flex gap-4 pb-6 relative">
<div class="timeline-line"></div>
<div class="timeline-dot mt-1"></div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface-variant">تم استلام الطلب</p>
</div>
</div>
<!-- Item 5 -->
<div class="flex gap-4 pb-6 relative">
<div class="timeline-line"></div>
<div class="timeline-dot mt-1"></div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface-variant">الطلب في الطريق</p>
</div>
</div>
<!-- Item 6 (Last) -->
<div class="flex gap-4 relative">
<div class="timeline-dot mt-1"></div>
<div class="flex-1">
<p class="font-body-md text-body-md text-on-surface-variant">تم التسليم</p>
</div>
</div>
</div>
</div>
</div>
</main>


</body></html>
