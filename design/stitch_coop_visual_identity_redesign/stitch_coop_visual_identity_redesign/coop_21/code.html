<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md antialiased selection:bg-primary/20 selection:text-primary">
<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl p-stack-lg md:p-10 shadow-[0px_4px_20px_rgba(139,30,63,0.04)] relative overflow-hidden">
<div class="flex justify-center mb-stack-lg">
<img alt="COOP Logo" class="h-24 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLujX7ELrSZHrnVz4bofisZDVd_3teHdvYauEBWc_FqNzqsu-O_AEDZBX0mCFnu6XINBzEV_4_46Op6a41FMQA9XD1ogrEVSdwOnBtQNvbV8nOFBCVaC66o6SSEVxtFFqz96iu8KxykeBuE9a8jiAoIUn3gyCmH7hSOTowHtG76AzmmBjtqzHRRNfu6um2l0UaRYFY4aiSagR_cphko3_HDWvq43E5oIFk2WG_GZn_nKcI_SRxMPqTdn8_YP"/>
</div>
<div class="text-center mb-stack-lg">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">مرحباً بعودتك</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">الرجاء إدخال بياناتك للمتابعة</p>
</div>
<form action="#" class="flex flex-col gap-y-stack-md" method="POST" onsubmit="event.preventDefault(); document.getElementById('error-state').classList.remove('hidden'); document.getElementById('password-input').classList.add('border-error');">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit text-right" for="identifier">رقم الهاتف أو البريد الإلكتروني</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-4 text-outline-variant pointer-events-none">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pr-12 pl-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant/60 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all shadow-sm" id="identifier" name="identifier" placeholder="أدخل رقمك أو بريدك" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-unit text-right" for="password-input">كلمة المرور</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute right-4 text-outline-variant pointer-events-none">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pr-12 pl-12 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline-variant/60 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10 transition-all shadow-sm" id="password-input" name="password" placeholder="أدخل كلمة المرور" required="" type="password"/>
<button class="absolute left-4 text-outline hover:text-primary transition-colors flex items-center justify-center" onclick="const input = document.getElementById('password-input'); const icon = this.querySelector('span'); if(input.type === 'password') { input.type = 'text'; icon.innerText = 'visibility_off'; } else { input.type = 'password'; icon.innerText = 'visibility'; }" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="hidden mt-2 flex items-center gap-x-1 text-error" id="error-state">
<span class="material-symbols-outlined text-[16px]">error</span>
<p class="font-body-sm text-[12px]">بيانات الدخول غير صحيحة، يرجى المحاولة مرة أخرى.</p>
</div>
</div>
<div class="flex items-center justify-between mt-unit mb-2">
<div class="flex items-center gap-x-2">
<input class="rounded border-outline-variant text-primary focus:ring-primary/20 w-4 h-4 cursor-pointer" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer mt-1" for="remember">تذكرني</label>
</div>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container font-medium transition-colors" href="#">نسيت كلمة المرور؟</a>
</div>
<button class="w-full bg-primary text-on-primary font-button text-button py-4 rounded-xl shadow-[0_4px_12px_rgba(108,0,41,0.2)] hover:shadow-[0_8px_24px_rgba(108,0,41,0.3)] hover:bg-primary-container active:scale-[0.98] transition-all duration-200 mt-2 flex items-center justify-center gap-x-2" type="submit">
                تسجيل الدخول
                <span class="material-symbols-outlined text-[20px] rtl:rotate-180">arrow_forward</span>
</button>
</form>
<div class="mt-stack-lg text-center border-t border-outline-variant/30 pt-stack-md">
<p class="font-body-sm text-body-sm text-on-surface-variant inline-block">ليس لديك حساب؟</p>
<a class="font-body-sm text-body-sm text-primary font-semibold hover:underline mr-2 transition-all" href="#">إنشاء حساب جديد</a>
</div>
</div>
</body></html>
