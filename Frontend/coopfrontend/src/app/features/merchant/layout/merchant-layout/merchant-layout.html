<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="wordmark-full">COOP</span>
      <span class="wordmark-short">C</span>
    </div>

    <nav class="nav">
      <a routerLink="overview" routerLinkActive="active" class="nav-link">
        <svg
          class="nav-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" />
        </svg>
        <span class="nav-label">الرئيسية</span>
      </a>

      <a routerLink="profile" routerLinkActive="active" class="nav-link">
        <svg
          class="nav-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 8l1-4h14l1 4" />
          <path d="M4 8v11a1 1 0 0 0 1 1h3v-6h8v6h3a1 1 0 0 0 1-1V8" />
          <path d="M4 8h16" />
        </svg>
        <span class="nav-label">ملف المتجر</span>
      </a>

      <a routerLink="branches" routerLinkActive="active" class="nav-link">
        <svg
          class="nav-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11z" />
          <circle cx="12" cy="10" r="2.5" />
        </svg>
        <span class="nav-label">الفروع</span>
      </a>

      <a routerLink="products" routerLinkActive="active" class="nav-link">
        <svg
          class="nav-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 7l9-4 9 4-9 4-9-4z" />
          <path d="M3 7v10l9 4 9-4V7" />
          <path d="M12 11v10" />
        </svg>
        <span class="nav-label">المنتجات</span>
      </a>

      <a routerLink="offers" routerLinkActive="active" class="nav-link">
        <svg
          class="nav-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="7" cy="7" r="1.5" />
          <circle cx="17" cy="17" r="1.5" />
          <path d="M6 18 18 6" />
        </svg>
        <span class="nav-label">العروض</span>
      </a>

      <a routerLink="orders" routerLinkActive="active" class="nav-link">
        <svg
          class="nav-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M8 6h13M8 12h13M8 18h13" />
          <path d="M3 6h.01M3 12h.01M3 18h.01" />
        </svg>
        <span class="nav-label">الطلبات</span>
      </a>

      <a routerLink="reviews" routerLinkActive="active" class="nav-link">
        <svg
          class="nav-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3l2.6 5.6 6.2.6-4.6 4.2 1.3 6.1L12 16.9 6.5 19.5l1.3-6.1L3.2 9.2l6.2-.6L12 3z" />
        </svg>
        <span class="nav-label">التقييمات</span>
      </a>

      <a routerLink="complaints" routerLinkActive="active" class="nav-link">
        <svg
          class="nav-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v5" />
          <path d="M12 16h.01" />
        </svg>
        <span class="nav-label">الشكاوى</span>
      </a>

      <a routerLink="notifications" routerLinkActive="active" class="nav-link">
        <svg
          class="nav-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 8a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 12 6 8z" />
          <path d="M9.5 17a2.5 2.5 0 0 0 5 0" />
        </svg>
        <span class="nav-label">الإشعارات</span>
      </a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 class="page-title">{{ pageTitle() }}</h1>

      <div class="topbar-actions">
        <a routerLink="notifications" class="bell-button" aria-label="الإشعارات">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 8a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 12 6 8z" />
            <path d="M9.5 17a2.5 2.5 0 0 0 5 0" />
          </svg>
          @if (unreadCount() > 0) {
            <span class="badge">{{ unreadCount() }}</span>
          }
        </a>

        <div class="user-menu">
          <button type="button" class="user-button" (click)="toggleMenu($event)">
            <span>{{ userName() }}</span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>

          @if (menuOpen()) {
            <div class="dropdown">
              <button type="button" class="dropdown-item" disabled>تغيير كلمة المرور</button>
              <button type="button" class="dropdown-item" (click)="logout()">
                تسجيل الخروج
              </button>
            </div>
          }
        </div>
      </div>
    </header>

    <main class="content">
      <div class="content-inner">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
