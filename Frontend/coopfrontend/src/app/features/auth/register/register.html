<div class="page">
  <div class="wrapper">
    <coop-card>
      <p class="wordmark">COOP</p>
      <p class="heading">إنشاء حساب</p>
      <p class="subtitle">تسوّق أفضل العروض في الأردن</p>

      @if (errorMessage(); as message) {
        <coop-alert tone="danger">{{ message }}</coop-alert>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <coop-field
          label="الاسم الكامل"
          [error]="fullNameErrorMessage()"
          [touched]="form.controls.fullName.touched"
        >
          <input id="fullName" type="text" formControlName="fullName" autocomplete="name" />
        </coop-field>

        <coop-field
          label="البريد الإلكتروني"
          [error]="emailErrorMessage()"
          [touched]="form.controls.email.touched"
        >
          <input id="email" type="email" formControlName="email" autocomplete="email" />
        </coop-field>

        <coop-field
          label="رقم الهاتف"
          [error]="phoneNumberErrorMessage()"
          [touched]="form.controls.phoneNumber.touched"
        >
          <input id="phoneNumber" type="tel" formControlName="phoneNumber" autocomplete="tel" />
        </coop-field>

        <coop-field
          label="كلمة المرور"
          [error]="passwordErrorMessage()"
          [touched]="form.controls.password.touched"
        >
          <div class="input-with-toggle">
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="new-password"
            />
            <coop-password-toggle [visible]="showPassword()" (toggled)="togglePasswordVisibility()" />
          </div>
        </coop-field>

        <coop-field
          label="تأكيد كلمة المرور"
          [error]="confirmPasswordErrorMessage()"
          [touched]="form.controls.confirmPassword.touched"
        >
          <div class="input-with-toggle">
            <input
              id="confirmPassword"
              [type]="showConfirmPassword() ? 'text' : 'password'"
              formControlName="confirmPassword"
              autocomplete="new-password"
            />
            <coop-password-toggle
              [visible]="showConfirmPassword()"
              (toggled)="toggleConfirmPasswordVisibility()"
            />
          </div>
        </coop-field>

        <coop-button type="submit" [loading]="submitting()" [disabled]="submitting()">
          @if (submitting()) {
            جارٍ إنشاء الحساب...
          } @else {
            إنشاء الحساب
          }
        </coop-button>

        <p class="switch-link">
          لديك حساب بالفعل؟ <a routerLink="/login">تسجيل الدخول</a>
        </p>
      </form>
    </coop-card>
  </div>
</div>
