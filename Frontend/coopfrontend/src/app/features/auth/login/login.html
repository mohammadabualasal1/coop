<div class="page">
  <div class="wrapper">
    <coop-card>
      <p class="wordmark">COOP</p>
      <p class="subtitle">لوحة تحكم التجار والمشرفين</p>

      @if (errorMessage(); as message) {
        <coop-alert tone="danger">{{ message }}</coop-alert>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <coop-field
          label="البريد الإلكتروني"
          [error]="emailErrorMessage()"
          [touched]="form.controls.email.touched"
        >
          <input id="email" type="email" formControlName="email" autocomplete="email" />
        </coop-field>

        <coop-field
          label="كلمة المرور"
          [error]="passwordErrorMessage()"
          [touched]="form.controls.password.touched"
        >
          <input
            id="password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </coop-field>

        <button type="button" class="link-button">نسيت كلمة المرور؟</button>

        <coop-button type="submit" [loading]="submitting()" [disabled]="submitting()">
          @if (submitting()) {
            جارٍ تسجيل الدخول...
          } @else {
            تسجيل الدخول
          }
        </coop-button>

        <p class="switch-link">
          ليس لديك حساب؟ <a routerLink="/register">إنشاء حساب</a>
        </p>
      </form>
    </coop-card>
  </div>
</div>
