@switch (status()) {
  @case ('loading') {
    <div class="loading-state">
      <coop-spinner [size]="32" />
    </div>
  }

  @case ('error') {
    <div class="page-content">
      <coop-alert tone="danger">{{ loadErrorMessage() }}</coop-alert>
      <coop-button variant="secondary" (click)="load()">إعادة المحاولة</coop-button>
    </div>
  }

  @case ('loaded') {
    <div class="page-content">
      <h2 class="page-title">المفضلة</h2>

      @if (offers().length === 0) {
        <coop-empty-state
          title="لا توجد عروض في المفضلة"
          message="اضغط على القلب في أي عرض لحفظه هنا"
        />
      } @else {
        <div class="offers-grid">
          @for (offer of offers(); track offer.id) {
            <app-offer-card [offer]="offer" />
          }
        </div>
      }
    </div>
  }
}
