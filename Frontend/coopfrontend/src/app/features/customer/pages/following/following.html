@switch (status()) {
  @case ('loading') {
    <div class="loading-state">
      <coop-spinner [size]="32" />
    </div>
  }

  @case ('error') {
    <div class="page-content">
      <coop-alert tone="danger">{{ loadErrorMessage() }}</coop-alert>
      <coop-button variant="secondary" (click)="load()">إعادة المحاولة</coop-button>
    </div>
  }

  @case ('loaded') {
    <div class="page-content">
      <h2 class="page-title">متاجري المتابَعة</h2>

      @if (merchants().length === 0) {
        <coop-empty-state title="لا تتابع أي متجر" message="تابع متاجرك المفضلة لتصلك عروضها" />
      } @else {
        <div class="merchants-grid">
          @for (merchant of merchants(); track merchant.id) {
            <app-merchant-card [merchant]="merchant" [showUnfollowButton]="true" />
          }
        </div>
      }
    </div>
  }
}
